[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-fixer"
dynamic = ["version"]
description = "Safe, reproducible YOLO and COCO dataset transformations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Tristan Walter"}]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "albumentations>=2.0.8,<3",
  "batchgeneratorsv2>=0.3.2,<0.4",
  "ipython>=8",
  "matplotlib>=3.7",
  "nnunetv2==2.8.1",
  "numpy>=2.5.1,<2.6",
  "opencv-python>=4.12",
  "openpyxl>=3.1",
  "pandas>=2",
  "Pillow>=10",
  "pycocotools>=2.0.7",
  "PyYAML>=6",
  "sahi>=0.12.5",
  "scikit-image>=0.26,<0.27",
  "scipy>=1.18,<1.19",
  "shapely>=2",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "ultralytics>=8.3",
  "wandb>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
write_to = "src/dataset_fixer/_version.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
