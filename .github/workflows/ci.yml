name: CI

on:
  # Automatic CI is temporarily disabled; keep the workflow available for a
  # deliberate manual run while framework development is moving quickly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest

  runtime-smoke:
    name: Mandatory runtime imports
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install complete runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"

      - name: Run tests with complete runtime installed
        env:
          MPLBACKEND: Agg
        run: python -m pytest

      - name: Verify mandatory backends can be imported
        run: python -c "import albumentations, batchgeneratorsv2, nnunetv2, numpy, pandas, pycocotools, sahi, scipy, skimage, torch, ultralytics, wandb; print(numpy.__version__, scipy.__version__, skimage.__version__, sahi.__version__, ultralytics.__version__)"

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "from dataset_fixer import Dataset, ComparisonResult; print(Dataset, ComparisonResult)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
